  generate_dataset_wp1_common:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_wp1_common.py --output output/dataset_wp1_common.csv.gz
      --dummy-data-file analysis/dummy_data/dummy_dataset_wp1_common.csv.gz
    outputs:
      highly_sensitive:
        dataset: output/dataset_wp1_common.csv.gz

