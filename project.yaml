    outputs:
      highly_sensitive:
        dataset: output/dataset_wp1_2025.csv.gz

  wp1_processing_main:
    run: r:v2 analysis/wp1/0_wp1_processing_main.R
    needs: [generate_dataset_wp1_common, generate_dataset_wp1_2023]
    outputs:
      highly_sensitive:
        data: output/wp1/wp1_main.csv
      moderately_sensitive:
        csv: output/wp1/checks/main/check_*.csv
        figs: output/wp1/checks/main/figures/*.png
        txt: output/wp1/checks/main/skim*.txt
   
  wp1_processing_ts_2019:
    run: r:v2 analysis/wp1/1_wp1_processing_ts_2019.R
    needs: [generate_dataset_wp1_common, generate_dataset_wp1_2019]
    outputs:
      highly_sensitive:
        data: output/wp1/wp1_ts_2019.csv.gz
      moderately_sensitive:
        csv: output/wp1/checks/ts/*.csv
        figs: output/wp1/checks/ts/figures/*.png
        txt: output/wp1/checks/ts/skim_2019.txt
   
  wp1_processing_ts_2020:
    run: r:v2 analysis/wp1/1_wp1_processing_ts_2020.R
    needs: [generate_dataset_wp1_common, generate_dataset_wp1_2020]
    outputs:
      highly_sensitive:
        data: output/wp1/wp1_ts_2020.csv.gz
      moderately_sensitive:
        csv: output/wp1/checks/ts/c*.csv
        figs: output/wp1/checks/ts/figures/p*.png
        txt: output/wp1/checks/ts/skim_2020.txt
     
  wp1_processing_ts_2021:
    run: r:v2 analysis/wp1/1_wp1_processing_ts_2021.R
    needs: [generate_dataset_wp1_common, generate_dataset_wp1_2021]
