    #needs: [generate_dataset_wp1_common]
    outputs:
      highly_sensitive:
        dataset: output/dataset_wp1_2023.csv.gz
        
  generate_dataset_wp1_2024:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_wp1_time_dep.py --output output/dataset_wp1_2024.csv.gz
