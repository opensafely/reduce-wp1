    needs: [generate_dataset_wp1_common, generate_dataset_wp1_2022]
    outputs:
      highly_sensitive:
        data: output/wp1/wp1_ts_2022.csv.gz
      moderately_sensitive:
        csv: output/wp1/checks/ts/che*.csv
        figs: output/wp1/checks/ts/figures/plo*.png
        txt: output/wp1/checks/ts/skim_2022.txt
     
  wp1_processing_ts_2023:
    run: r:v2 analysis/wp1/1_wp1_processing_ts_2023.R
    needs: [generate_dataset_wp1_common, generate_dataset_wp1_2023]
    outputs:
      highly_sensitive:
        data: output/wp1/wp1_ts_2023.csv.gz
      moderately_sensitive:
        csv: output/wp1/checks/ts/chec*.csv
        figs: output/wp1/checks/ts/figures/plot*.png
        txt: output/wp1/checks/ts/skim_2023.txt
    
  wp1_processing_ts_2024:
    run: r:v2 analysis/wp1/1_wp1_processing_ts_2024.R
    needs: [generate_dataset_wp1_common, generate_dataset_wp1_2024]
    outputs:
      highly_sensitive:
        data: output/wp1/wp1_ts_2024.csv.gz
      moderately_sensitive:
        csv: output/wp1/checks/ts/check*.csv
        figs: output/wp1/checks/ts/figures/plots*.png
        txt: output/wp1/checks/ts/skim_2024.txt
     
  wp1_processing_ts_2025:
    run: r:v2 analysis/wp1/1_wp1_processing_ts_2025.R
    needs: [generate_dataset_wp1_common, generate_dataset_wp1_2025]
    outputs:
      highly_sensitive:
        data: output/wp1/wp1_ts_2025.csv.gz
      moderately_sensitive:
        csv: output/wp1/checks/ts/check_*.csv
        figs: output/wp1/checks/ts/figures/plots_*.png
        txt: output/wp1/checks/ts/skim_2025.txt
     
  wp1_timeseries:
    run: r:v2 analysis/wp1/2_wp1_timeseries.R 
    needs: [wp1_processing_ts_2019, wp1_processing_ts_2020, wp1_processing_ts_2021, wp1_processing_ts_2022, wp1_processing_ts_2023, wp1_processing_ts_2024, wp1_processing_ts_2025]
    outputs:
      moderately_sensitive:
        csv: output/wp1/wp1_timeseries.csv
        plot: output/wp1/figures/plot*.png

  wp1_tables:
    run: r:v2 analysis/wp1/3_wp1_tables.R 
    needs: [wp1_processing_main]
    outputs:
      moderately_sensitive:
        csv: output/wp1/tables/wp1_*.csv

  wp1_combinations:
    run: r:v2 analysis/wp1/4_wp1_combinations.R 
    needs: [wp1_processing_main]
    outputs:
      moderately_sensitive:
