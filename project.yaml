  generate_dataset_wp1_2019:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_wp1_time_dep.py --output output/dataset_wp1_2019.csv.gz
      --dummy-data-file analysis/dummy_data/dummy_dataset_wp1_2019.csv.gz
      -- --cohort_index_date "2019-02-01"
    #needs: [generate_dataset_wp1_common]
    outputs:
      highly_sensitive:
        dataset: output/dataset_wp1_2019.csv.gz

  generate_dataset_wp1_2020:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_wp1_time_dep.py --output output/dataset_wp1_2020.csv.gz
      --dummy-data-file analysis/dummy_data/dummy_dataset_wp1_2020.csv.gz
