  generate_dataset_wp1_2023:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_wp1_time_dep.py --output output/dataset_wp1_2023.csv.gz
      --dummy-data-file analysis/dummy_data/dummy_dataset_wp1_2023.csv.gz
